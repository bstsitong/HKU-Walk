name: hku-walk
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hku_walk
      POSTGRES_USER: hku
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hku -d hku_walk"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    build: ..
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_DATA_DIR: /data
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DJANGO_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DJANGO_PUBLIC_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env}
      DJANGO_ALLOWED_HOSTS: ${APP_DOMAIN},127.0.0.1,localhost
      DJANGO_TRUST_PROXY: "1"
      DJANGO_DB_SSL_REQUIRE: "0"
    secrets: [django_secret_key, postgres_password, admin_password]
    volumes: ["app_data:/data"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 8s
      start_period: 90s
      retries: 6
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on:
      api: {condition: service_healthy}
secrets:
  django_secret_key: {file: ./secrets/django_secret_key}
  postgres_password: {file: ./secrets/postgres_password}
  admin_password: {file: ./secrets/admin_password}
volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
